/* ---- distanceProvider abstraction ----
   If ORS_API_KEY is set, uses real driving time (cached per pair, async).
   Falls back to straight-line haversine instantly if no key or on any error —
   callers never need to know which mode is active. */
const distanceProvider = {
  _cache: {},
  isEstimate: !ORS_API_KEY,
  km(a, b){
    const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
    const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  },
  label(a, b){ return this.km(a,b).toFixed(1) + " km"; },
  _key(a,b){ return `${a.lat.toFixed(4)},${a.lng.toFixed(4)}|${b.lat.toFixed(4)},${b.lng.toFixed(4)}`; },
  /* Async real travel time; caller passes a render callback that fires again
     once the real number arrives, so the UI shows straight-line immediately
     and upgrades in place — never blocks, never breaks if ORS is down. */
  travelTimeMin(a, b, onReady){
    if (!ORS_API_KEY) return null;
    const key = this._key(a,b);
    if (this._cache[key] !== undefined) { onReady(this._cache[key]); return; }
    fetch("https://api.openrouteservice.org/v2/directions/driving-car?api_key="+ORS_API_KEY+
      `&start=${a.lng},${a.lat}&end=${b.lng},${b.lat}`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
      .then(d => {
        const sec = d.features?.[0]?.properties?.summary?.duration;
        const min = sec ? Math.round(sec/60) : null;
        this._cache[key] = min;
        if (min !== null) onReady(min);
      })
      .catch(() => { /* silent fallback — straight-line label already shown */ });
  }
};
function nearest(point, list){
  let best=null, bestD=Infinity;
  list.forEach(p => { const d=distanceProvider.km(point,p); if(d<bestD){bestD=d;best=p;} });
  return { place: best, km: bestD.toFixed(1) };
}

function stars(n){

const sectorItems = [];
SECTORS.forEach(s => {
  const c = RANK_COLORS[s.rank];
  sectorItems.push(L.circle([s.lat,s.lng], { radius:s.radiusM, color:c, weight:RANK_WEIGHT[s.rank], fillColor:c, fillOpacity:RANK_OPACITY[s.rank] }));
  const box = (cls, label, items) => `<div class="box ${cls}"><b>${label}</b><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  const conf = CONFIDENCE[s.confidence] || CONFIDENCE.unvalidated;
  sectorItems.push(
    L.marker([s.lat,s.lng], { icon: sectorIcon(s.rank), zIndexOffset: 900 })
      .bindPopup(`<div class="card-title">#${s.rank} 🏘️ ${s.name}</div>
        <div class="card-stars">${stars(s.stars)} &nbsp; <span style="color:${conf.color};font-weight:700;font-size:11px;">${conf.label}</span></div>
        ${box("pros","✅ Pros", s.pros)}
        ${box("cons","⚠️ Cons", s.cons)}
        ${box("verify","🔍 Verify in person", s.verify)}
        ${box("conn","📍 Connectivity", s.conn)}`)
  );
});
layers["🏘️ Sectors"] = L.layerGroup(sectorItems);

layers["🧒 EuroKids"] = L.markerClusterGroup({ maxClusterRadius: 40 });
EUROKIDS.forEach(e => layers["🧒 EuroKids"].addLayer(L.marker([e.lat,e.lng], { icon: pinIcon("🧒","#f59e0b") }).bindPopup(`<b>🧒 ${e.name}</b>${e.note?`<br><span class="pop-tag">${e.note}</span>`:""}`)));

layers["🎓 Schools"] = L.markerClusterGroup({ maxClusterRadius: 40 });
SCHOOLS.forEach(s => layers["🎓 Schools"].addLayer(L.marker([s.lat,s.lng], { icon: pinIcon("🎓","#2e7d43") }).bindPopup(`<b>🎓 ${s.name}</b>`)));

layers["🚇 Metro"] = L.layerGroup(METRO.map(m => L.marker([m.lat,m.lng], { icon: pinIcon("🚇","#6a3fa0") }).bindPopup(`<b>🚇 ${m.name}</b>`)));

layers["🏥 Hospitals"] = L.markerClusterGroup({ maxClusterRadius: 40 });
HOSPITALS.forEach(h => layers["🏥 Hospitals"].addLayer(L.marker([h.lat,h.lng], { icon: pinIcon("🏥","#b02a37") }).bindPopup(`<b>🏥 ${h.name}</b>`)));

layers["✈️ Airport & Rail"] = L.layerGroup(AIRPORT_RAIL.map(l =>
  L.marker([l.lat,l.lng], { icon: pinIcon(l.em,"#8a6d1c",34) })
    .bindPopup(`<b>${l.em} ${l.name}</b><br><span class="pop-tag">📏 ${distanceProvider.label(l,OFFICE)}${distanceProvider.isEstimate?" (straight-line)":""}</span>`)
));
layers["🛒 Markets"] = L.layerGroup(MARKETS.map(m => L.marker([m.lat,m.lng], { icon: pinIcon("🛒","#3a6ea5") }).bindPopup(`<b>🛒 ${m.name}</b>`)));
layers["🌳 Parks"] = L.layerGroup(PARKS.map(p => L.marker([p.lat,p.lng], { icon: pinIcon("🌳","#4c9a58") }).bindPopup(`<b>🌳 ${p.name}</b>`)));
layers["🏠 Houses"] = L.markerClusterGroup({ maxClusterRadius: 35, disableClusteringAtZoom: 15 });

const defaultOff = new Set(["🌳 Parks","🛒 Markets","🎓 Schools"]);
const chipsDiv = document.getElementById("chips");
Object.entries(layers).forEach(([name, layer]) => {
  const on = !defaultOff.has(name);
  if (on) layer.addTo(map);
  const chip = document.createElement("button");
  chip.className = "chip" + (on ? " on" : "");
  chip.textContent = name;
  chip.addEventListener("click", () => {
    if (map.hasLayer(layer)) { map.removeLayer(layer); chip.classList.remove("on"); }
    else { layer.addTo(map); chip.classList.add("on"); }
  });
  chipsDiv.appendChild(chip);
});

/* ---- Drawer ---- */
const drawer = document.getElementById("drawer");
const caret = document.getElementById("drawerCaret");
document.getElementById("drawerHead").addEventListener("click", () => {
  drawer.classList.toggle("collapsed");
  caret.textContent = drawer.classList.contains("collapsed") ? "▲ show" : "▼ hide";
});

/* ---- Add house button ---- */
document.getElementById("addHouseBtn").addEventListener("click", () => {
  if (GOOGLE_FORM_URL) window.open(GOOGLE_FORM_URL, "_blank");
  else alert("Paste your Google Form URL into GOOGLE_FORM_URL at the top of the file first.");
});

/* ---- Filters ---- */
const rentSlider = document.getElementById("rentSlider");
const rentVal = document.getElementById("rentVal");
const hideRejected = document.getElementById("hideRejected");
const searchBox = document.getElementById("searchBox");
rentSlider.addEventListener("input", () => { rentVal.textContent = "₹" + Number(rentSlider.value).toLocaleString("en-IN"); renderHouses(); });
hideRejected.addEventListener("change", renderHouses);
searchBox.addEventListener("input", renderHouses);

/* ---- Distance spider ---- */
let spiderLayer = L.layerGroup().addTo(map);
function drawSpider(house){
  spiderLayer.clearLayers();
  const targets = [
    { label:"🏢 Office", point: OFFICE },
    { label:"🚇 Metro", point: nearest(house, METRO).place, km: nearest(house, METRO).km },
    { label:"🧒 EuroKids", point: nearest(house, EUROKIDS).place, km: nearest(house, EUROKIDS).km },
    { label:"🏥 Hospital", point: nearest(house, HOSPITALS).place, km: nearest(house, HOSPITALS).km },
  ];
  targets.forEach(t => {
    if (!t.point) return;
    const km = t.km || distanceProvider.km(house, t.point).toFixed(1);
    spiderLayer.addLayer(L.polyline([[house.lat,house.lng],[t.point.lat,t.point.lng]], { color:"#16233b", weight:1.5, dashArray:"3 5", opacity:0.7 }));
    const mid = [(house.lat+t.point.lat)/2, (house.lng+t.point.lng)/2];
    spiderLayer.addLayer(L.marker(mid, { icon: L.divIcon({ className:"", html:`<div class="spider-label">${t.label} ${km}km</div>`, iconSize:[0,0] }) }));
  });
}
map.on("click", () => spiderLayer.clearLayers());

/* ---- Houses ---- */
const statusMeta = {
  "scheduled":   { em:"🔘", color:"#7a8699" },
  "to visit":    { em:"🟠", color:"#e8930c" },
  "visited":     { em:"🔵", color:"#3a6ea5" },
  "shortlisted": { em:"🟢", color:"#2e7d43" },
  "negotiating": { em:"🤝", color:"#8a4fbf" },
  "final":       { em:"✅", color:"#1b7a3d" },
  "rejected":    { em:"⚪", color:"#9aa3b2" }
};
let houseRows = [];

function parseCSV(text){
  const rows=[]; let row=[], cell="", inQ=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (inQ){ if (c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else {
      if (c==='"') inQ=true;
      else if (c===","){ row.push(cell); cell=""; }
      else if (c==="\n"||c==="\r"){ if(cell!==""||row.length){row.push(cell);rows.push(row);row=[];cell="";} }
      else cell+=c;
    }
  }
  if (cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function driveThumb(url){
  if (!url) return null;
  const m = url.match(/[-\w]{25,}/); // Drive file ID pattern
  if (m) return `https://drive.google.com/uc?export=view&id=${m[0]}`;
  return url; // assume direct image URL otherwise
}

function computeScore(h){
  let weightedSum = 0, weightTotal = 0;
  Object.entries(SCORE_WEIGHTS).forEach(([key, weight]) => {
    const v = parseFloat(h[key]);
    if (!isNaN(v)) { weightedSum += (v/5)*weight; weightTotal += weight; }
  });
  if (!weightTotal) return null;
  return Math.round((weightedSum / weightTotal) * 100);
}

function ratingBars(h){
  const labels = { rCommute:"🚗 Commute", rSafety:"🛡️ Safety", rPreschool:"🧒 Preschool", rParking:"🅿️ Parking",
    rVentilation:"🌬️ Ventilation", rRentValue:"💰 Rent value", rSociety:"🏘️ Society" };
  const rows = Object.entries(labels).map(([key,label]) => {
    const v = parseFloat(h[key]);
    if (isNaN(v)) return "";
    const pct = (v/5)*100;
    return `<div style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:10.5px;">
      <span style="width:82px;flex-shrink:0;">${label}</span>
      <span style="flex:1;background:#eef1f5;border-radius:4px;height:7px;overflow:hidden;">
        <span style="display:block;height:100%;width:${pct}%;background:${scoreRingColor(pct)};"></span>
      </span>
      <span style="width:16px;text-align:right;">${v}</span>
    </div>`;
  }).join("");
  return rows ? `<div class="box conn"><b>📊 Ratings (weighted by your priorities)</b>${rows}</div>` : "";
}

function findSector(areaName){
  if (!areaName) return null;
  const q = areaName.toLowerCase();
  return SECTORS.find(s => s.name.toLowerCase().includes(q) || q.includes(s.name.toLowerCase().split(",")[0].split("(")[0].trim().toLowerCase())) || null;
}

function daysSince(ts){
  if (!ts) return null;
  const d = new Date(ts);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function nudgeFor(h){
  const days = daysSince(h.ts);
  const st = (h.status||"").toLowerCase();
  if (st === "negotiating" && days !== null && days >= 7) return `⚠️ Negotiating for ${days} days`;
  if (st === "to visit" && days !== null && days >= 10) return `⚠️ Logged ${days} days ago, not visited yet`;
  if (!h.notes && (st === "visited" || st === "shortlisted")) return `⚠️ No notes added yet`;
  return null;
}
function updateStats(visibleRows){
  const total = visibleRows.length;
  let rentSum=0, rentN=0, cheapest=null, best=null;
  const areaCounts = {};
  visibleRows.forEach(h => {
    const r = parseFloat(h.rent);
    if (!isNaN(r)){ rentSum+=r; rentN++; if (!cheapest || r<parseFloat(cheapest.rent)) cheapest=h; }
    if (h.area) areaCounts[h.area] = (areaCounts[h.area]||0)+1;
    const sc = computeScore(h);
    if (sc!==null && (!best || sc>best.score)) best = { h, score: sc };
  });
  const avgRent = rentN ? Math.round(rentSum/rentN).toLocaleString("en-IN") : "—";
  let topArea = "—", topAreaN = 0;
  Object.entries(areaCounts).forEach(([a,n]) => { if (n>topAreaN){topArea=a;topAreaN=n;} });
  const negotiatingN = visibleRows.filter(h => (h.status||"").toLowerCase()==="negotiating").length;
  const statsDiv = document.getElementById("stats");
  statsDiv.innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">🏠 Tracked</div></div>
    <div class="stat"><div class="num" style="font-size:11px;">${best ? best.h.name : "—"}</div><div class="lbl">🏆 Best (${best?best.score:"—"})</div></div>
    <div class="stat"><div class="num" style="font-size:12px;">${cheapest ? "₹"+Number(cheapest.rent).toLocaleString("en-IN") : "—"}</div><div class="lbl">💸 Cheapest</div></div>
    <div class="stat"><div class="num">${negotiatingN}</div><div class="lbl">🤝 Negotiating</div></div>
    <div class="stat"><div class="num">₹${avgRent}</div><div class="lbl">💰 Avg rent</div></div>
    <div class="stat"><div class="num" style="font-size:12px;">${topArea}</div><div class="lbl">📍 Most tracked</div></div>
  `;
}

function renderActivity(rows){
  const feed = document.getElementById("activityFeed");
  const sorted = [...rows].filter(r=>r.ts).sort((a,b)=> new Date(b.ts) - new Date(a.ts)).slice(0,8);
  feed.innerHTML = sorted.map(h => `<div class="activity-row"><b>${h.name}</b> — ${h.status||"to visit"} <br>${h.ts}</div>`).join("") || `<div class="activity-row">No timestamped entries yet.</div>`;
}

function renderHouses(){
  layers["🏠 Houses"].clearLayers();
  const listEl = document.getElementById("houseList");
  const sideListEl = document.getElementById("sideHouseList");
  listEl.innerHTML = ""; sideListEl.innerHTML = "";

  const maxRent = Number(rentSlider.value);
  const hideRej = hideRejected.checked;
  const q = searchBox.value.trim().toLowerCase();

  const visible = houseRows.filter(h => {
    const r = parseFloat(h.rent);
    if (!isNaN(r) && r > maxRent) return false;
    if (hideRej && (h.status||"").toLowerCase()==="rejected") return false;
    if (q && !`${h.name} ${h.area} ${h.contact} ${h.notes} ${h.status}`.toLowerCase().includes(q)) return false;
    return true;
  });

  visible.forEach(h => {
    const meta = statusMeta[(h.status||"to visit").toLowerCase()] || statusMeta["to visit"];
    const distKm = distanceProvider.label(h, OFFICE);
    const score = computeScore(h);
    const thumb = driveThumb(h.photo);
    const sector = findSector(h.area);
    const nudge = nudgeFor(h);
    const distId = "dist_" + Math.random().toString(36).slice(2);

    const popupParts = [
      `<div class="card-title">🏠 ${h.name}</div>`,
      thumb ? `<img class="house-photo" src="${thumb}" onerror="this.style.display='none'">` : "",
      score!==null ? `<div class="card-stars">Score: <b>${score}/100</b> (weighted by your priorities)</div>` : "",
      sector ? `<div class="box conn"><b>🏘️ #${sector.rank} ${sector.name}</b>${stars(sector.stars)} · ${(CONFIDENCE[sector.confidence]||CONFIDENCE.unvalidated).label}<br>
        Known issues: ${sector.cons[0]||"—"}</div>` : "",
      nudge ? `<div class="box cons"><b>${nudge}</b></div>` : "",
      `<div class="box conn"><b>📍 ${h.area||""}</b>
        💰 ₹${h.rent||"?"}/mo · 📐 ${h.sqft||"?"} sqft · ${h.furnishing||""}<br>
        🔧 Maintenance: ${h.maint||"?"} · 📞 ${h.contact||""}<br>
        <span class="pop-tag" id="${distId}">📏 ${distKm}${distanceProvider.isEstimate?" (straight-line)":""} to office</span></div>`,
      ratingBars(h),
      h.notes ? `<div class="box verify"><b>📝 Notes</b>${h.notes}</div>` : "",
      `<span class="status-pill" style="background:${meta.color}">${meta.em} ${h.status||"to visit"}</span>`
    ];

    const marker = L.marker([h.lat,h.lng], { icon: pinIcon("🏠", meta.color, 30) }).bindPopup(popupParts.join(""));
    marker.on("click", () => {
      drawSpider(h);
      if (ORS_API_KEY) distanceProvider.travelTimeMin(h, OFFICE, min => {
        const el = document.getElementById(distId);
        if (el) el.innerHTML = `📏 🚗 ${min} min drive to office`;
      });
    });
    layers["🏠 Houses"].addLayer(marker);

    const ringColor = score!==null ? scoreRingColor(score) : "#c7cedb";
    const cardHtml = `
      ${thumb ? `<img class="thumb" src="${thumb}" onerror="this.style.display='none'">` : `<div class="thumb"></div>`}
      <div class="body">
        <div class="name">🏠 ${h.name} — ₹${h.rent||"?"}</div>
        <div class="meta">${h.area||""} · 📏 ${distKm}${nudge?" · "+nudge:""}</div>
        <span class="status-pill" style="background:${meta.color}">${meta.em} ${h.status||"to visit"}</span>
      </div>
      ${score!==null ? `<div class="score-ring" style="background:${ringColor}">${score}</div>` : ""}
    `;

    [listEl, sideListEl].forEach(container => {
      const item = document.createElement("div");
      item.className = "house-item";
      item.innerHTML = cardHtml;
      item.addEventListener("click", () => {
        map.setView([h.lat,h.lng], 15); marker.openPopup(); drawSpider(h);
        if (window.innerWidth < 900) { drawer.classList.add("collapsed"); caret.textContent = "▲ show"; }
      });
      container.appendChild(item);
    });
  });

  updateStats(visible);
  renderActivity(visible);
  const statusText = visible.length ? `✅ ${visible.length} shown` : "No houses match current filters.";
  document.getElementById("houseStatus").textContent = statusText;
  document.getElementById("sideHouseStatus").textContent = statusText;
}

function loadHouses(){
  document.getElementById("houseStatus").textContent = "Loading…";
  document.getElementById("sideHouseStatus").textContent = "Loading…";
  if (!HOUSES_CSV_URL){
    houseRows = []; renderHouses();
    const msg = "📋 Google Sheet not connected yet.";
    document.getElementById("houseStatus").textContent = msg;
    document.getElementById("sideHouseStatus").textContent = msg;
    return;
  }
  fetch(HOUSES_CSV_URL + (HOUSES_CSV_URL.includes("?")?"&":"?") + "cachebust=" + Date.now())
    .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(text => {
      const rows = parseCSV(text).slice(1);
      houseRows = rows.map(r => {
        const [ts,name,area,coords,rent,sqft,furnishing,maint,contact,notes,status,photo,
               rCommute,rSafety,rPreschool,rParking,rVentilation,rRentValue,rSociety] = r;
        if (!coords) return null;
        const m = coords.match(/(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)/);
        if (!m) return null;
        const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
        if (isNaN(lat)||isNaN(lng)) return null;
        return { ts,name,area,lat,lng,rent,sqft,furnishing,maint,contact,notes,
          status:(status||"to visit").trim().toLowerCase(), photo,
          rCommute,rSafety,rPreschool,rParking,rVentilation,rRentValue,rSociety };
      }).filter(Boolean);
      renderHouses();
    })
    .catch(err => {
      const msg = "⚠️ Couldn't fetch sheet (" + err.message + ").";
      document.getElementById("houseStatus").textContent = msg;
      document.getElementById("sideHouseStatus").textContent = msg;
    });
}

document.getElementById("refreshBtn").addEventListener("click", loadHouses);
loadHouses();
</script>
